name: Paopao2 Scheduler

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

concurrency:
  group: paopao2
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run scheduler
        env:
          BOT_USER: "星星在南"
          BOT_PASS: "123456"
        run: |
          python paopao2_scheduler.py --login "$BOT_USER" "$BOT_PASS"

      - name: Auto restart
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HOUR_BJ=$(TZ=Asia/Shanghai date +%H)
          if [ $HOUR_BJ -ge 7 ] && [ $HOUR_BJ -lt 22 ]; then
            echo "BJ time ${HOUR_BJ}:00, working hours, restart in 30s..."
            sleep 30
            curl -s -X POST               -H "Authorization: token $GH_TOKEN"               -H "Accept: application/vnd.github.v3+json"               "https://api.github.com/repos/${{ github.repository }}/actions/workflows/paopao2_bot.yml/dispatches"               -d '"'"'{"ref":"main"}'"'"'
            echo "triggered"
          else
            echo "BJ time ${HOUR_BJ}:00, off hours, skip restart"
          fi
